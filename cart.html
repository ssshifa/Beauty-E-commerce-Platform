<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="shortcut icon" href="Logo.png">
</head>
<body>
    <nav class="navigation">
        <a href="#" class="logo">
            <img src="Logo.png" alt="Lush Aura"/>
        </a>
        <div class="nav-menu">
            <a href="index.html" class="active">Home</a>
            <a href="shop.html">Shop</a>
            
            <div class="dropdown">
                <a href="#">Categories <i class="fas fa-caret-down"></i></a>
                <div class="dropdown-menu">
                    <ul>
                        <li><a href="#brandSection">Brands</a></li>
                        <li><a href="#">Beauty Tips</a></li>
                        <li><a href="#">Clearance Sale</a></li>
                        <li><a href="#">New Arrival</a></li>
                    </ul>
                </div>
            </div>
    
            <a href="contactuspage.html">Contact Us</a>
        </div>
        
        <form class="search-box" action="#" method="GET">
            <input type="text" placeholder="Search..." required/>
            <button type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
        
        <div class="nav-buttons">
            <a href="login.html" class="nav-user" aria-label="User Account">
                <i class="fa-solid fa-user"></i>
            </a>
            <a href="#" class="nav-wishlist" aria-label="Wishlist">
                <i class="fa-solid fa-heart"></i>
            </a>
            <a href="cart.html" class="nav-cart" aria-label="Shopping Cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>
    </nav>

    <div class="cart">
        <h2>CART</h2>
    
        <div class="listCart">
            <div class="item">
                <img src="sheglam.jpeg" alt="Product Image">
                <div class="content">
                    <div class="name">CoPilot / Black / Automatic</div>
                    <div class="price">$550 / 1 product</div>
                </div>
                <div class="quantity">
                    <button>-</button>
                    <span class="value">3</span>
                    <button>+</button>
                </div>
            </div>
        </div>
    
        <div class="buttons">
            <div class="close">
                CLOSE
            </div>
            <div class="checkout">
                <a href="checkout.html">CHECKOUT</a>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
