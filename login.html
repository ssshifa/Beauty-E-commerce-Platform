<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="Logo.png">
    <title>LushAura | Login & Registration</title>
</head>
<body>

    <div class="wrapper">
        <nav class="nav">
            <div class="nav-logo">
                <img src="Logo.png" alt="Lush Aura" />
            </div>
            
            <nav class="navigation">
                <a href="home.html">Home</a>
                <a href="#">Shop</a>
                <a href="#">Categories</a>
                <a href="contactuspage.html">Contact Us</a>
                
    
            </nav>
            <div class="nav-button">
                <button class="btn white-btn" id="loginBtn" onclick="window.location.href='login.html'">Login</button>
                <button class="btn" id="registerBtn" onclick="window.location.href='register.html'">Register</button>
                
            </div>
            <div class="nav-menu-btn">
                <i class="bx bx-menu" onclick="myMenuFunction()"></i>
            </div>
        </nav>

        <!--login register-->
        <div class="container">
            <div class="drop">
                <div class="content">
                    <h2>Log In</h2>
                    <form>
                        <div class="input">
                            <input type="text" name="username" placeholder="Username">
                        </div>
                        <div class="input">
                            <input type="password" name="password" placeholder="Password">
                        </div>
                        <div class="input" >
                            <input type="submit" value="Login" href="#">
                        </div>
                    </form>
                </div>
            </div>
           <!-- Popup Notification -->
<div id="popup" class="popup">
    <p>Recovery code has been sent to your email</p>
    <button onclick="closePopup()">OK</button>
</div>

<!-- "Already have an account?" Button -->
<a href="trial.html" class="btnn" onclick="showPopup(event)">Forgot password?</a>

            <a href="register.html" class="btnn signup">Register</a>
        </div>

    <!---->

<script>
    function showPopup(event) {
    event.preventDefault(); // Prevents redirecting to trial.html
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

</script>
    
</body>
</html>
